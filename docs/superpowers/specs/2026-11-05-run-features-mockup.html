<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Strava redesign, all dark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Pre-dawn: run screens (dark) */
    --ink: #0B1626;
    --ink-2: #14243B;
    --ink-line: #24385380;
    --snow: #F2F5F9;
    --mist: #8C9DB5;
    /* Streetlight amber: the one accent, both themes */
    --amber: #FFB000;
    /* Day screens (light, follows phone setting) */
    --paper: #F4F6F9;
    --card: #FFFFFF;
    --text: #0F1B2D;
    --muted: #5A6A80;
    --line: #DCE2EA;

    --num: "Barlow Condensed", "Roboto Condensed", sans-serif;
    --body: "Barlow", "Roboto", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #D5DCE4;
    font-family: var(--body);
    color: var(--text);
    padding: 40px 16px 64px;
  }
  .intro { max-width: 760px; margin: 0 auto 36px; }
  .intro h1 { font-family: var(--num); font-weight: 600; font-size: 40px; line-height: 1.05; }
  .intro p { margin-top: 8px; font-size: 17px; line-height: 1.45; color: #3C4A5E; }

  .row { display: flex; flex-wrap: wrap; gap: 40px 32px; justify-content: center; }
  figure { width: 340px; }
  figcaption { margin-top: 14px; font-size: 15px; line-height: 1.45; color: #3C4A5E; }
  figcaption b { color: var(--text); font-weight: 600; }

  /* Phone shell */
  .phone {
    width: 340px; height: 720px;
    border-radius: 42px; border: 9px solid #1B2028;
    overflow: hidden; position: relative;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 40px -18px #0B162666;
  }
  .phone.dark { background: var(--ink); color: var(--snow); }
  .phone.light { background: var(--paper); color: var(--text); }
  .status { height: 30px; flex: none; display: flex; justify-content: space-between; align-items: center; padding: 0 22px; font-size: 13px; font-weight: 500; }
  .status i { display: inline-block; width: 22px; height: 10px; border: 1.5px solid currentColor; border-radius: 3px; opacity: .8; }
  .gesture { height: 22px; flex: none; display: grid; place-items: center; }
  .gesture::after { content: ""; width: 110px; height: 4px; border-radius: 2px; background: currentColor; opacity: .35; }
  .screen { flex: 1; display: flex; flex-direction: column; padding: 8px 22px 14px; min-height: 0; }

  .num { font-family: var(--num); font-variant-numeric: tabular-nums; line-height: .9; }
  .lbl { font-size: 14px; color: var(--mist); }
  .light .lbl { color: var(--muted); }
  .title { font-family: var(--num); font-weight: 600; font-size: 34px; line-height: 1; }

  .btn {
    font: 600 18px var(--body); border-radius: 18px; height: 60px;
    display: grid; place-items: center; border: 0; cursor: pointer; width: 100%;
  }
  .btn.amber { background: var(--amber); color: var(--ink); }
  .btn.ghost { background: transparent; color: inherit; border: 2px solid var(--ink-line); }
  .light .btn.ghost { border-color: var(--line); }
  .btn:focus-visible, .seg button:focus-visible, .step:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }

  /* 1. Ready */
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--ink-2); border-radius: 14px; padding: 4px; margin-top: 12px; }
  .seg button { font: 500 16px var(--body); color: var(--mist); background: none; border: 0; height: 42px; border-radius: 11px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--snow); color: var(--ink); }
  .stepper { display: flex; align-items: center; justify-content: space-between; margin-top: 26px; }
  .step { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--ink-line); background: none; color: var(--snow); font: 500 28px var(--body); cursor: pointer; }
  .hint { font-size: 13.5px; line-height: 1.45; color: var(--mist); }

  /* 2. Running */
  .rec { display: flex; justify-content: space-between; font-size: 14px; color: var(--mist); }
  .rec span:first-child { color: var(--snow); font-weight: 500; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--amber); margin-right: 7px; vertical-align: 1px; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .bar { height: 6px; border-radius: 3px; background: var(--ink-2); margin-top: 14px; overflow: hidden; }
  .bar > div { height: 100%; width: 96%; background: var(--amber); border-radius: 3px; }
  .trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .trio .num { font-size: 32px; font-weight: 600; margin-top: 4px; }
  .trio small { font: 500 15px var(--body); color: var(--mist); }

  .hold { position: relative; overflow: hidden; background: var(--ink-2); color: var(--snow); user-select: none; -webkit-user-select: none; touch-action: none; }
  .hold .fill { position: absolute; inset: 0; background: var(--amber); transform: scaleX(0); transform-origin: left; }
  .hold.holding .fill { transform: scaleX(1); transition: transform 1.2s linear; }
  .hold span { position: relative; }
  .hold.holding span, .hold.done span { color: var(--ink); }
  .hold.done .fill { transform: scaleX(1); }

  /* 3. History */
  .runs { list-style: none; margin: 14px -22px 0; flex: 1; overflow: hidden; }
  .runs li { padding: 14px 22px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 2px 12px; }
  .runs li:last-child { border-bottom: 1px solid var(--line); }
  .runs .when { grid-column: 1 / -1; font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .runs .km { font-size: 36px; font-weight: 600; }
  .runs .km small { font: 500 16px var(--body); color: var(--muted); margin-left: 3px; }
  .runs .side { text-align: right; font-size: 15px; line-height: 1.35; font-variant-numeric: tabular-nums; }
  .runs .side span { color: var(--muted); }
  .runs .note { grid-column: 1 / -1; font-size: 14px; color: var(--muted); margin-top: 4px; }
  .tag { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 8px; background: var(--text); color: var(--paper); }
  .pair { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; margin-top: 12px; }
  .light .btn.amber { color: var(--text); }

  /* 4. Detail */
  .topbar { display: flex; align-items: center; justify-content: space-between; height: 48px; flex: none; padding: 0 10px; }
  .topbar strong { font-weight: 600; font-size: 17px; }
  .icon { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; }
  .map { height: 270px; flex: none; }
  .map svg { display: block; width: 100%; height: 100%; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 8px; padding: 18px 22px 0; }
  .grid .num { font-size: 30px; font-weight: 600; margin-top: 4px; }
  .grid .lead { grid-column: 1 / -1; }
  .grid .lead .num { font-size: 64px; }
  .grid small { font: 500 14px var(--body); color: var(--muted); margin-left: 2px; }

  /* 5. Log */
  .field { margin-top: 18px; }
  .field .lbl { margin-bottom: 6px; display: block; }
  .input { background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; height: 54px; display: flex; align-items: center; padding: 0 16px; font-size: 18px; }
  .input.big { font-family: var(--num); font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; justify-content: space-between; }
  .input.big small { font: 500 16px var(--body); color: var(--muted); }
  .hms { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .note-box { height: 76px; align-items: flex-start; padding-top: 14px; font-size: 16px; color: var(--muted); }
  .calc { margin-top: 14px; font-size: 15px; color: var(--muted); }
  .calc b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

  .phone.light { --paper: var(--ink); --card: var(--ink-2); --text: var(--snow); --muted: var(--mist); --line: #243853; background: var(--ink); color: var(--snow); }
  .light .btn.amber { color: var(--ink); }
  .input { color: var(--snow); }

  @media (prefers-reduced-motion: reduce) {
    .dot { animation: none; }
    .hold.holding .fill { transition-duration: 0s; }
  }
</style>
</head>
<body>

<div class="intro">
  <h1>Local Strava, new look</h1>
  <p>Dark everywhere now, including history, run details and the notebook. The map is darkened to match. Amber is the only colour, and it means "this matters now". Try pressing and holding Stop on the second screen.</p>
</div>

<div class="row">

  <!-- 1. Ready -->
  <figure>
    <div class="phone dark">
      <div class="status"><span>7:02</span><i></i></div>
      <div class="screen">
        <div class="title" style="margin-top:18px">Ready to run</div>

        <div style="margin-top:40px" class="lbl">Ring me at</div>
        <div class="seg" role="group" aria-label="Alert type">
          <button aria-pressed="false">Off</button>
          <button aria-pressed="true">Distance</button>
          <button aria-pressed="false">Time</button>
        </div>
        <div class="stepper">
          <button class="step" aria-label="Less">−</button>
          <div class="num" style="font-size:72px;font-weight:600">5.0<span style="font:500 22px var(--body);color:var(--mist);margin-left:6px">km</span></div>
          <button class="step" aria-label="More">+</button>
        </div>
        <p class="hint" style="margin-top:22px;text-align:center">Rings and vibrates once, even in your pocket.</p>

        <div style="flex:1"></div>
        <p class="hint" style="margin-bottom:16px">Samsung: also add this app to Settings › Battery › Background usage limits › Never sleeping apps.</p>
        <button class="btn amber">Start run</button>
      </div>
      <div class="gesture"></div>
    </div>
    <figcaption><b>Ready.</b> Pick a distance or time to be rung at. The Samsung tip only shows until the phone stops putting the app to sleep.</figcaption>
  </figure>

  <!-- 2. Running -->
  <figure>
    <div class="phone dark">
      <div class="status"><span>7:31</span><i></i></div>
      <div class="screen">
        <div class="rec" style="margin-top:6px"><span><span class="dot"></span>Recording</span><span>GPS good</span></div>

        <div class="lbl" style="margin-top:30px">Distance</div>
        <div class="num" style="font-size:132px;font-weight:700;margin-top:2px;letter-spacing:-1px">4.82<span style="font:500 24px var(--body);color:var(--mist);margin-left:8px;letter-spacing:0">km</span></div>
        <div class="bar"><div></div></div>
        <div class="lbl" style="margin-top:8px">180 m until the 5 km bell</div>

        <div class="lbl" style="margin-top:28px">Time</div>
        <div class="num" style="font-size:76px;font-weight:600;margin-top:2px">28:14</div>

        <div class="trio" style="margin-top:28px">
          <div><div class="lbl">Pace now</div><div class="num">5:41</div></div>
          <div><div class="lbl">Average</div><div class="num">5:51</div></div>
          <div><div class="lbl">Climb</div><div class="num">34<small> m</small></div></div>
        </div>

        <div style="flex:1"></div>
        <div style="display:grid;grid-template-columns:1fr 1.3fr;gap:12px">
          <button class="btn ghost">Pause</button>
          <button class="btn hold" id="hold" aria-label="Hold to stop the run"><div class="fill"></div><span>Hold to stop</span></button>
        </div>
      </div>
      <div class="gesture"></div>
    </div>
    <figcaption><b>Running.</b> This is also what you see when you press the power button mid-run, no unlock needed. Stop needs a one-second hold so a pocket can't end your run.</figcaption>
  </figure>

  <!-- 3. History -->
  <figure>
    <div class="phone light">
      <div class="status"><span>12:40</span><i></i></div>
      <div class="screen">
        <div class="title" style="margin-top:18px">Runs</div>
        <ul class="runs">
          <li>
            <div class="when">Thu 5 Nov, 07:02</div>
            <div class="num km">5.02<small>km</small></div>
            <div class="side">28:41<br><span>5:43 /km</span></div>
          </li>
          <li>
            <div class="when">Tue 3 Nov, 18:30 <span class="tag">Logged</span></div>
            <div class="num km">8.00<small>km</small></div>
            <div class="side">44:10<br><span>5:31 /km</span></div>
            <div class="note">Track, 8 × 400 m, stopwatch</div>
          </li>
          <li>
            <div class="when">Sun 1 Nov, 08:15</div>
            <div class="num km">12.40<small>km</small></div>
            <div class="side">1:13:02<br><span>5:53 /km</span></div>
          </li>
          <li>
            <div class="when">Thu 29 Oct, 06:58</div>
            <div class="num km">5.11<small>km</small></div>
            <div class="side">29:20<br><span>5:44 /km</span></div>
          </li>
        </ul>
        <div class="pair">
          <button class="btn ghost">Log a run</button>
          <button class="btn amber">Start run</button>
        </div>
      </div>
      <div class="gesture"></div>
    </div>
    <figcaption><b>History.</b> Distance is the big number. Runs you typed in from the notebook get a "Logged" tag and show their note.</figcaption>
  </figure>

  <!-- 4. Detail -->
  <figure>
    <div class="phone light">
      <div class="status"><span>12:41</span><i></i></div>
      <div class="topbar">
        <span class="icon" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></span>
        <strong>Thu 5 Nov, 07:02</strong>
        <span class="icon" aria-label="Delete run"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></span>
      </div>
      <div class="map">
        <svg viewBox="0 0 340 270" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Route map">
          <rect width="340" height="270" fill="#15253B"/>
          <path d="M210 0h130v120c-40 10-90 0-130-30z" fill="#183630"/>
          <path d="M0 200c60-20 120 10 170 40s110 20 170 0v30H0z" fill="#142C48"/>
          <g stroke="#273B57" stroke-width="9" fill="none" stroke-linecap="round">
            <path d="M0 150h340M60 0v270M150 0v270M0 60h340M270 120v150"/>
          </g>
          <g stroke="#1F3049" stroke-width="4" fill="none">
            <path d="M0 105h340M105 0v270M220 130v140M0 30h210"/>
          </g>
          <path d="M60 205 V150 H150 V60 H230 C268 60 286 86 288 112 L270 150 V196 H150 V205 Z"
                fill="none" stroke="#0B1626" stroke-width="10" stroke-linejoin="round"/>
          <path d="M60 205 V150 H150 V60 H230 C268 60 286 86 288 112 L270 150 V196 H150 V205 Z"
                fill="none" stroke="#FFB000" stroke-width="4.5" stroke-linejoin="round"/>
          <circle cx="60" cy="205" r="8" fill="#F2F5F9" stroke="#0B1626" stroke-width="3"/>
        </svg>
      </div>
      <div class="grid">
        <div class="lead"><div class="lbl">Distance</div><div class="num">5.02<small style="font-size:18px">km</small></div></div>
        <div><div class="lbl">Moving time</div><div class="num">28:41</div></div>
        <div><div class="lbl">Pace</div><div class="num">5:43<small>/km</small></div></div>
        <div><div class="lbl">Total time</div><div class="num">30:02</div></div>
        <div><div class="lbl">Climb</div><div class="num">34<small>m</small></div></div>
        <div><div class="lbl">Highest</div><div class="num">112<small>m</small></div></div>
      </div>
      <div style="flex:1"></div>
      <div class="gesture"></div>
    </div>
    <figcaption><b>Run details.</b> Full-width map. The route line always draws, even offline, and map pieces you've seen before are kept. "Total time" includes pauses, worked out from the start and end times already saved.</figcaption>
  </figure>

  <!-- 5. Log a run -->
  <figure>
    <div class="phone light">
      <div class="status"><span>18:20</span><i></i></div>
      <div class="topbar">
        <span class="icon" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
        <strong>Log a run</strong>
        <span class="icon"></span>
      </div>
      <div class="screen" style="padding-top:0">
        <div class="field"><span class="lbl">When</span><div class="input">Tue 3 Nov, 18:30</div></div>
        <div class="field"><span class="lbl">Distance</span><div class="input big">8.00<small>km</small></div></div>
        <div class="field"><span class="lbl">Time</span>
          <div class="hms">
            <div class="input big">0<small>h</small></div>
            <div class="input big">44<small>m</small></div>
            <div class="input big">10<small>s</small></div>
          </div>
        </div>
        <p class="calc">Pace <b>5:31 /km</b></p>
        <div class="field"><span class="lbl">Note (optional)</span><div class="input note-box">Track, 8 × 400 m, stopwatch</div></div>
        <div style="flex:1"></div>
        <button class="btn amber">Save run</button>
      </div>
      <div class="gesture"></div>
    </div>
    <figcaption><b>Notebook.</b> For runs timed some other way. Distance and time are needed, and pace is worked out for you.</figcaption>
  </figure>

</div>

<script>
  // Hold-to-stop demo: 1.2 s press fills the button; letting go early cancels.
  (function () {
    const b = document.getElementById('hold');
    const label = b.querySelector('span');
    let t = null;
    const start = (e) => {
      if (e.type === 'keydown' && e.key !== ' ' && e.key !== 'Enter') return;
      if (e.repeat || b.classList.contains('done')) return;
      e.preventDefault();
      b.classList.add('holding');
      t = setTimeout(() => {
        b.classList.remove('holding'); b.classList.add('done'); label.textContent = 'Run saved';
        setTimeout(() => { b.classList.remove('done'); label.textContent = 'Hold to stop'; }, 1600);
      }, 1200);
    };
    const cancel = () => { clearTimeout(t); b.classList.remove('holding'); };
    b.addEventListener('pointerdown', start);
    b.addEventListener('keydown', start);
    ['pointerup', 'pointerleave', 'pointercancel', 'keyup', 'blur'].forEach(ev => b.addEventListener(ev, cancel));
  })();
</script>
</body>
</html>
