# Heap kept modest and daemon disabled: this build machine has limited free RAM
# and a larger/long-lived daemon gets OOM-killed mid-build.
org.gradle.jvmargs=-Xmx1280m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# Use KSP1 — most reliable with Room 2.6.1 + Kotlin 2.0.21
ksp.useKSP2=false
